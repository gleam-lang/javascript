name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: false
          gleam-version: "1.14.0"
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - run: gleam test
      - run: gleam format --check src test
